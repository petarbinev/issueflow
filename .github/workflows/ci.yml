name: Verify app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  local-stack:
    name: Fresh Supabase reset and bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Allocate available ports for this disposable stack
        run: |
          node --input-type=module <<'JS'
          import {createServer} from 'node:net';
          import {readFile,writeFile} from 'node:fs/promises';
          const servers=Array.from({length:3},()=>createServer());
          try {
            await Promise.all(servers.map(server=>new Promise((resolve,reject)=>server.once('error',reject).listen(0,'127.0.0.1',resolve))));
            const [api,database,shadow]=servers.map(server=>server.address().port);
            const file='supabase/config.toml';
            const config=await readFile(file,'utf8');
            await writeFile(file,config.replace(/(\[api\][\s\S]*?\nport = )\d+/,`$1${api}`).replace(/(\[db\][\s\S]*?\nport = )\d+/,`$1${database}\nshadow_port = ${shadow}`));
          } finally {
            await Promise.all(servers.map(server=>new Promise(resolve=>server.close(resolve))));
          }
          JS
      - name: Start isolated local services
        run: |
          mkdir -p test-results
          supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta > test-results/local-start.log 2>&1
      - name: Reset all local migrations and seed
        run: supabase db reset --yes > test-results/local-reset.log 2>&1
      - name: Verify first-admin bootstrap and workflows
        run: |
          supabase status -o json > test-results/local-status.json
          node scripts/verify-local-stack.mjs test-results/local-status.json
      - name: Show redacted local diagnostics on failure
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          for(const file of ['test-results/local-start.log','test-results/local-reset.log']) {
            const text=await readFile(file,'utf8').catch(()=> '');
            console.log(text.replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g,'[redacted token]').replace(/sb_(?:secret|publishable)_[A-Za-z0-9_-]+/g,'[redacted key]').replace(/postgres(?:ql)?:\/\/[^@\s]+@/g,'postgresql://[redacted]@'));
          }
          JS
      - name: Discard local stack
        if: always()
        run: supabase stop --no-backup
